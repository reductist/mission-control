[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mission-control"
version = "0.1.0"
description = "Portable, self-hosted project and operations control plane"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Patrik von Rickenbach and Mission Control contributors" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "rich>=15,<16",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
mcctl = "mission_control.cli:main"
mcd = "mission_control.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mission_control"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/reductist/mission-control"
Repository = "https://github.com/reductist/mission-control"
Issues = "https://github.com/reductist/mission-control/issues"
