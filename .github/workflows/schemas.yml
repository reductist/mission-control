name: Schemas

on:
  pull_request:
    paths:
      - "schema/**"
      - "mission_control/schemas/**"
      - "scripts/check-schemas.sh"
      - ".github/workflows/schemas.yml"
  push:
    branches: [main]
    paths:
      - "schema/**"
      - "mission_control/schemas/**"
      - "scripts/check-schemas.sh"
      - ".github/workflows/schemas.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install pinned CUE
        run: go install cuelang.org/go/cmd/cue@v0.16.1

      - name: Show CUE version
        run: cue version

      - name: Validate schemas and fixtures
        run: bash scripts/check-schemas.sh
